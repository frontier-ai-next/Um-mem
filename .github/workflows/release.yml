name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify release version and main ancestry
        run: |
          version="v$(node -p 'require("./npm/package.json").version')"
          test -f "docs/releases/$version.md"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "$version"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi

  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [metadata, verify]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build platform executables
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=".exe"; fi
          for name in $(node -p 'Object.keys(require("./npm/package.json").bin).join(" ")'); do
            go build -tags purego -trimpath -ldflags="-s -w" \
              -o "dist/$name-$GOOS-$GOARCH$suffix" "./cmd/$name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [metadata, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Pack the public npm launchers
        run: |
          mkdir -p dist
          npm pack ./npm --pack-destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: npm-launchers
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum um-memory-* um-mem-cli-*.tgz > SHA256SUMS
          sha256sum --check SHA256SUMS
          cd ..
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft \
            --title "UM-MEM $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
