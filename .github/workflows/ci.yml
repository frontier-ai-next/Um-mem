name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go-port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go test -tags purego ./...
      - run: go vet ./...
      - run: go vet -tags purego ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify npm Go installation
        working-directory: npm
        env:
          UM_MEM_GO_TEST_SOURCE: "1"
        run: npm test
      - run: npm ci --prefix integrations/opencode
      - name: Verify OpenCode against native Go Mnemosyne
        env:
          UM_MEM_SMOKE_GO: go
        run: npm test --prefix integrations/opencode
      - name: Verify Zvec native installation
        env:
          UM_MEM_TEST_ZVEC_AUTOINSTALL: "1"
        run: go test -tags purego ./internal/native/zvec -run '^TestNativeLibraryAutoinstall$' -count=1
